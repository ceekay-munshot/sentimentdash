name: Scrape sentiment data

on:
  schedule:
    # Frequent opportunities reduce missed/delayed cron delivery. Durable checkpoints permit
    # a source check only every two hours; intervening runs only resume captured Git history.
    # GitHub scheduling remains best-effort, so readers independently evaluate source times.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pipeline self-test
        run: |
          node scripts/scrape/selftest.mjs
          node scripts/scrape/reliability-selftest.mjs

      - name: Scrape sources
        run: node scripts/scrape/run.mjs
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh sentiment scrape"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Report incomplete source checks
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const capture = JSON.parse(readFileSync('public/data/collection.json', 'utf8'));
          const failed = Object.entries(capture.sources).filter(([, source]) => source.error || source.state === 'cooldown');
          if (failed.length) {
            console.error('Retained data published; source checks need recovery:', failed.map(([name]) => name).join(', '));
            process.exitCode = 1;
          }
          JS
