name: Verify reliability
on:
  pull_request:
  push:
    branches: [main]
    paths: ['scripts/**', 'api/**', '.github/workflows/verify.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/scrape/selftest.mjs
      - run: node scripts/scrape/reliability-selftest.mjs
      - run: node api/selftest.mjs
      - run: node api/reliability-selftest.mjs
