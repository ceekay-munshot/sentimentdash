name: Deploy API

# Ships the API Worker (wrangler.api.jsonc). The dashboard Worker is deployed
# separately and is untouched by this workflow.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — from the Workers & Pages overview page

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only when the API itself changes — not on the twice-daily data commits.
    paths:
      - 'api/**'
      - 'wrangler.api.jsonc'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: API self-test
        run: node api/selftest.mjs

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@latest deploy -c wrangler.api.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
